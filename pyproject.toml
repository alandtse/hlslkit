[project]
name = "hlslkit"
version = "0.0.1"
description = "Tools for automating HLSL shader compilation, diagnostics, and define management."
authors = [{name = "Alan Tse", email = "alandtse@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    "pyyaml>=6.0.2",
    "tqdm>=4.67.1",
    "py-markdown-table>=1.3.0",
    "psutil>=7.0.0",
    "pcpp>=1.30",
    "jellyfish>=1.2.0",
    "pathspec>=0.12.1",
    "xxhash>=3.0.0"
]

[project.urls]
Repository = "https://github.com/alandtse/hlslkit"
Documentation = "https://alandtse.github.io/hlslkit/"

[project.optional-dependencies]
gui = ["gooey"]

[project.scripts]
hlslkit-compile = "hlslkit.compile_shaders:main"
hlslkit-generate = "hlslkit.generate_shader_defines:main"
hlslkit-buffer-scan = "hlslkit.buffer_scan:main"

[tool.poetry]
packages = [
  {include = "hlslkit"}
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
deptry = "^0.25.1"
pyright = "^1.1.382"
pre-commit = "^4.0.0"
tox = "^4.11.1"
pytest-mock = "^3.14.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.4.2"
mkdocs-material = "^9.2.7"
mkdocstrings = {extras = ["python"], version = "^0.26.1"}
# griffe 2.0 renamed/restructured its package layout (split into griffelib/
# griffecli); mkdocstrings-python 1.x still imports the pre-2.0 API and
# breaks at import time on 2.x. Pin below 2.0 until mkdocstrings-python
# ships a release that supports the new layout.
griffe = "<2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["hlslkit"]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportArgumentType = false
reportCallIssue = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Ignore McCabe complexity
    "C901",
]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["hlslkit"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
